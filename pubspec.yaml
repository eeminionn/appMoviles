name: app_moviles
description: "InDrive, aplicación de viajes para pasajeros."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  geocoding: ^5.0.1
  google_maps_flutter: ^2.18.1
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.18.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  latlong2: ^0.10.1
  pointer_interceptor: ^0.10.1+3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
